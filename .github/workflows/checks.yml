name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python verify_sizes.py
      - run: python verify_inputs.py
      - run: python verify_templates.py
      - run: python verify_qr.py
      - run: python verify_designer.py
      - run: python -m pip_audit -r requirements.txt
